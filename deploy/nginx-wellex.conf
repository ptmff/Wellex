# wellex.fun — standalone vhost, not managed by ispmanager.
# Installed as /etc/nginx/conf.d/wellex.conf
# App: /opt/wellex (frontend static + wellex-api.service on 127.0.0.1:3100)

upstream wellex_api {
    server 127.0.0.1:3100;
    keepalive 16;
}

map $http_upgrade $wellex_connection_upgrade {
    default upgrade;
    ""      close;
}

# 443 catch-all: unknown SNI gets a TLS alert instead of the wellex certificate.
# No default_server flag so it never conflicts with panel-generated vhosts.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;
    ssl_reject_handshake on;
}

# No port-80 server here on purpose: this file is included before the
# ispmanager default server in nginx.conf, so any :80 block would become the
# default for every unknown host on the box (roundcube, phpmyadmin, ...).
# HTTP->HTTPS is done by Cloudflare ("Always Use HTTPS"); ACME HTTP-01
# follows that redirect and is answered by the 443 server below.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.wellex.fun;

    ssl_certificate     /etc/letsencrypt/live/wellex.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wellex.fun/privkey.pem;

    return 301 https://wellex.fun$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wellex.fun;

    ssl_certificate     /etc/letsencrypt/live/wellex.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wellex.fun/privkey.pem;
    ssl_session_cache   shared:wellex_ssl:5m;
    ssl_session_timeout 1d;

    include /etc/nginx/wellex-cloudflare-realip.inc;

    access_log /var/log/nginx/wellex.access.log;
    error_log  /var/log/nginx/wellex.error.log;

    root /opt/wellex/frontend;
    index index.html;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/wellex/acme;
        default_type text/plain;
    }

    # Ops endpoints stay internal (on the host: curl 127.0.0.1:3100/metrics)
    location = /metrics         { return 404; }
    location = /health/detailed { return 404; }

    location = /health {
        proxy_pass http://wellex_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://wellex_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://wellex_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wellex_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Landing (landing/index.html) on the bare root; the SPA lives on /markets etc.
    location = / {
        try_files /landing.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Landing assets without content hashes
    location ~ ^/assets/(consent\.js|legal\.css)$ {
        expires 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        # /legal/<slug> -> static legal/<slug>.html from the landing build
        try_files $uri $uri.html /index.html;
    }
}
