<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — ВЕЛЛЕКС</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12141a">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/legal.css">
<style>
  .nf{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 0}
  .nf-in{max-width:480px}
  .nf img{width:86px;height:86px;object-fit:contain;margin:0 auto 26px}
  .nf-code{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--accent)}
  .nf h1{margin:16px 0 0;font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em}
  .nf p{margin-top:16px;color:var(--muted)}
  .nf-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
</style>
</head>
<body>
<div class="bg-fx"></div>
<div class="wrap">
  <div class="nf">
    <div class="nf-in">
      <img src="/assets/logo.png" alt="Веллекс">
      <div class="nf-code">ОШИБКА 404</div>
      <h1>Такой страницы нет</h1>
      <p>Вероятность найти её здесь — 0%. Вернитесь на главную или загляните в правовые документы.</p>
      <div class="nf-actions">
        <a class="btn btn-primary" href="/">На главную</a>
        <a class="btn btn-ghost" href="/legal/terms">Документы</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
